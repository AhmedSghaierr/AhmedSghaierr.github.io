<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expense Tracker</title>

</head>
<style>
body {
  margin: 0;
  font-family: Arial;
  background: linear-gradient(135deg, #0f172a, #1e293b);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  color: white;
}

/* MAIN APP CARD */
.container {
  width: 90%;
  max-width: 420px;
  background: rgba(255, 255, 255, 0.06);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 18px;
  padding: 20px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.5);
}

/* TITLE */
h2 {
  text-align: center;
  margin-bottom: 15px;
}

/* INPUTS */
input, select {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border-radius: 10px;
  border: none;
  outline: none;
  background: rgba(255,255,255,0.1);
  color: white;
}

input::placeholder {
  color: rgba(255,255,255,0.6);
}

/* BUTTON */
button {
  width: 100%;
  margin-top: 10px;
  padding: 12px;
  border: none;
  border-radius: 10px;
  background: linear-gradient(90deg, #6366f1, #8b5cf6);
  color: white;
  font-weight: bold;
  cursor: pointer;
  transition: 0.2s;
}

button:hover {
  transform: scale(1.03);
}

/* LIST */
ul {
  list-style: none;
  padding: 0;
  margin-top: 15px;
}

li {
  background: rgba(255,255,255,0.08);
  margin-top: 10px;
  padding: 12px;
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

/* SMALL TEXT */
small {
  opacity: 0.7;
}

/* ACTION BUTTONS */
li button {
  width: auto;
  padding: 6px 10px;
  margin-right: 5px;
  font-size: 12px;
  background: rgba(255,255,255,0.15);
}

/* TOTAL BOX */
#totals {
  margin-top: 15px;
  text-align: center;
  font-weight: bold;
  padding: 10px;
  background: rgba(255,255,255,0.08);
  border-radius: 10px;
}

/* FILTER */
#filter {
  margin-top: 10px;
}
</style>

<body>

<div class="container">
  <h2>Expense Tracker</h2>

  <input id="name" placeholder="Expense name">
  <input id="amount" type="number" placeholder="Amount">

  <select id="category">
    <option value="Food">Food</option>
    <option value="Transport">Transport</option>
    <option value="Study">Study</option>
    <option value="Other">Other</option>
  </select>

  <button onclick="addExpense()">Add Expense</button>

  <ul id="list"></ul>

  <div class="totals" id="totals"></div>
</div>

<script>
let expenses = JSON.parse(localStorage.getItem("expenses")) || [];

function addExpense() {
  const name = document.getElementById("name").value;
  const amount = document.getElementById("amount").value;
  const category = document.getElementById("category").value;

  if (!name || !amount) return;

  expenses.push({
    name,
    amount: Number(amount),
    category,
    date: new Date().toLocaleDateString()
  });

  save();
  clearInputs();
  render();
}

function deleteExpense(index) {
  expenses.splice(index, 1);
  save();
  render();
}

function editExpense(index) {
  const exp = expenses[index];

  const newName = prompt("Edit name:", exp.name);
  const newAmount = prompt("Edit amount:", exp.amount);

  if (newName && newAmount) {
    expenses[index].name = newName;
    expenses[index].amount = Number(newAmount);
    save();
    render();
  }
}

function save() {
  localStorage.setItem("expenses", JSON.stringify(expenses));
}

function clearInputs() {
  document.getElementById("name").value = "";
  document.getElementById("amount").value = "";
}

function render() {
  const list = document.getElementById("list");
  const totals = document.getElementById("totals");

  list.innerHTML = "";

  let total = 0;
  let categoryTotals = {};

  expenses.forEach((exp, index) => {
    total += exp.amount;

    categoryTotals[exp.category] = (categoryTotals[exp.category] || 0) + exp.amount;

    list.innerHTML += `
      <li>
        <div class="row">
          <strong>${exp.name}</strong>
          <span>${exp.amount} DT</span>
        </div>

        <div class="small">
          ${exp.category} • ${exp.date}
        </div>

        <div class="actions">
          <button onclick="editExpense(${index})">Edit</button>
          <button onclick="deleteExpense(${index})">Delete</button>
        </div>
      </li>
    `;
  });

  let categoryText = "";
  for (let cat in categoryTotals) {
    categoryText += `${cat}: ${categoryTotals[cat]} DT\n`;
  }

  totals.innerText =
    `Total: ${total} DT\n\nBy Category:\n${categoryText}`;
}

render();
</script>

</body>
</html>
