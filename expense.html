<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expense Tracker</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: linear-gradient(135deg, #0f172a, #1e293b);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  color: white;
}

/* APP CONTAINER */
.container {
  width: 92%;
  max-width: 420px;
  background: rgba(255, 255, 255, 0.06);
  backdrop-filter: blur(14px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 18px;
  padding: 18px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  animation: fadeIn 0.6s ease;
}

/* TITLE */
h2 {
  text-align: center;
  margin-bottom: 10px;
  font-size: 20px;
}

/* INPUTS */
input, select {
  width: 100%;
  padding: 10px;
  margin-top: 8px;
  border-radius: 10px;
  border: none;
  outline: none;
  background: rgba(255,255,255,0.1);
  color: white;
  font-size: 13px;
}

input::placeholder {
  color: rgba(255,255,255,0.5);
}

/* BUTTON */
button {
  width: 100%;
  margin-top: 10px;
  padding: 10px;
  border: none;
  border-radius: 10px;
  background: linear-gradient(90deg, #6366f1, #8b5cf6);
  color: white;
  font-weight: bold;
  cursor: pointer;
  transition: 0.2s;
  font-size: 13px;
}

button:hover {
  transform: scale(1.03);
}

/* FILTER */
#filter {
  margin-top: 8px;
}

/* LIST */
ul {
  list-style: none;
  padding: 0;
  margin-top: 12px;
}

/* ITEM */
li {
  background: rgba(255,255,255,0.08);
  margin-top: 10px;
  padding: 10px;
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  gap: 5px;
  animation: slideUp 0.3s ease;
}

/* SMALL TEXT */
small {
  opacity: 0.7;
  font-size: 11px;
}

/* ACTION BUTTONS */
li button {
  width: auto;
  padding: 5px 8px;
  font-size: 11px;
  margin-right: 5px;
  background: rgba(255,255,255,0.15);
}

/* TOTAL */
#totals {
  margin-top: 12px;
  text-align: center;
  font-weight: bold;
  padding: 10px;
  background: rgba(255,255,255,0.08);
  border-radius: 10px;
  font-size: 13px;
}

/* ANIMATIONS */
@keyframes fadeIn {
  from {opacity: 0; transform: translateY(15px);}
  to {opacity: 1; transform: translateY(0);}
}

@keyframes slideUp {
  from {opacity: 0; transform: translateY(10px);}
  to {opacity: 1; transform: translateY(0);}
}
</style>
</head>

<body>

<div class="container">
  <h2>💰 Expense Tracker</h2>

  <input id="name" placeholder="Expense name">
  <input id="amount" type="number" placeholder="Amount">

  <select id="category">
    <option value="Food">Food</option>
    <option value="Transport">Transport</option>
    <option value="Study">Study</option>
    <option value="Other">Other</option>
  </select>

  <button onclick="addExpense()">Add Expense</button>

  <select id="filter" onchange="render()">
    <option value="all">All</option>
    <option value="Food">Food</option>
    <option value="Transport">Transport</option>
    <option value="Study">Study</option>
    <option value="Other">Other</option>
  </select>

  <ul id="list"></ul>

  <div id="totals"></div>
</div>

<script>
let expenses = JSON.parse(localStorage.getItem("expenses")) || [];

function addExpense() {
  const name = document.getElementById("name").value;
  const amount = document.getElementById("amount").value;
  const category = document.getElementById("category").value;

  if (!name || !amount) return;

  expenses.push({
    name,
    amount: Number(amount),
    category,
    date: new Date().toLocaleDateString()
  });

  save();
  clearInputs();
  render();
}

function deleteExpense(index) {
  expenses.splice(index, 1);
  save();
  render();
}

function editExpense(index) {
  const exp = expenses[index];

  const newName = prompt("Edit name:", exp.name);
  const newAmount = prompt("Edit amount:", exp.amount);

  if (newName && newAmount) {
    expenses[index].name = newName;
    expenses[index].amount = Number(newAmount);
    save();
    render();
  }
}

function save() {
  localStorage.setItem("expenses", JSON.stringify(expenses));
}

function clearInputs() {
  document.getElementById("name").value = "";
  document.getElementById("amount").value = "";
}

function render() {
  const list = document.getElementById("list");
  const filter = document.getElementById("filter").value;
  const totals = document.getElementById("totals");

  list.innerHTML = "";

  let total = 0;

  const filtered = expenses.filter(e => {
    return filter === "all" || e.category === filter;
  });

  filtered.forEach((exp, index) => {
    total += exp.amount;

    list.innerHTML += `
      <li>
        <strong>${exp.name}</strong> - ${exp.amount} DT
        <small>${exp.category} • ${exp.date}</small>

        <div>
          <button onclick="editExpense(${index})">Edit</button>
          <button onclick="deleteExpense(${index})">Delete</button>
        </div>
      </li>
    `;
  });

  totals.innerText = "Total: " + total + " DT";
}

render();
</script>

</body>
</html>
