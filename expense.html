<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expense Tracker</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: linear-gradient(135deg, #0f172a, #1e293b);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  color: white;
}

/* APP */
.container {
  width: 92%;
  max-width: 420px;
  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(14px);
  border-radius: 18px;
  padding: 18px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  animation: fadeIn 0.6s ease;
}

/* TITLE */
h2 {
  text-align: center;
  font-size: 20px;
}

/* INPUTS */
input, select {
  width: 100%;
  padding: 10px;
  margin-top: 8px;
  border-radius: 10px;
  border: none;
  background: rgba(255,255,255,0.1);
  color: white;
  font-size: 13px;
}

input:focus, select:focus {
  box-shadow: 0 0 0 2px #6366f1;
}

/* BUTTON */
button {
  width: 100%;
  margin-top: 10px;
  padding: 10px;
  border-radius: 10px;
  border: none;
  background: linear-gradient(90deg, #6366f1, #8b5cf6);
  color: white;
  cursor: pointer;
  transition: 0.2s;
}

button:hover { transform: scale(1.03); }
button:active { transform: scale(0.97); }

/* LIST */
ul {
  list-style: none;
  padding: 0;
}

li {
  background: rgba(255,255,255,0.08);
  margin-top: 10px;
  padding: 10px;
  border-radius: 12px;
  animation: slideUp 0.3s ease;
  transition: 0.2s;
}

li:hover {
  transform: scale(1.02);
  background: rgba(255,255,255,0.12);
}

small { opacity: 0.7; }

/* ACTIONS */
.actions button {
  width: auto;
  padding: 5px 8px;
  font-size: 11px;
  margin-right: 5px;
  background: rgba(255,255,255,0.15);
}

/* TOTAL */
#totals {
  margin-top: 12px;
  text-align: center;
  padding: 10px;
  background: rgba(255,255,255,0.08);
  border-radius: 10px;
}

/* CHART */
canvas {
  margin-top: 15px;
}

/* ANIMATIONS */
@keyframes fadeIn {
  from {opacity:0; transform:translateY(15px);}
  to {opacity:1; transform:translateY(0);}
}

@keyframes slideUp {
  from {opacity:0; transform:translateY(10px);}
  to {opacity:1; transform:translateY(0);}
}
</style>
</head>

<body>

<div class="container">
  <h2>💰 Expense Tracker</h2>

  <input id="name" placeholder="Expense name">
  <input id="amount" type="number" placeholder="Amount">

  <select id="category">
    <option value="Food">Food</option>
    <option value="Transport">Transport</option>
    <option value="Study">Study</option>
    <option value="Other">Other</option>
  </select>

  <button onclick="addExpense()">Add Expense</button>

  <select id="filter" onchange="render()">
    <option value="all">All</option>
    <option value="Food">Food</option>
    <option value="Transport">Transport</option>
    <option value="Study">Study</option>
    <option value="Other">Other</option>
  </select>

  <ul id="list"></ul>

  <div id="totals"></div>

  <canvas id="chart"></canvas>
</div>

<script>
let expenses = JSON.parse(localStorage.getItem("expenses")) || [];
let chart;

function getIcon(category) {
  switch(category) {
    case "Food": return "🍔";
    case "Transport": return "🚕";
    case "Study": return "📚";
    default: return "💸";
  }
}

function addExpense() {
  const name = nameInput.value;
  const amount = amountInput.value;
  const category = categoryInput.value;

  if (!name || !amount) return;

  expenses.push({
    name,
    amount: Number(amount),
    category,
    date: new Date().toLocaleDateString()
  });

  save();
  clearInputs();
  render();
}

function deleteExpense(i) {
  expenses.splice(i,1);
  save();
  render();
}

function editExpense(i) {
  const e = expenses[i];
  const newName = prompt("Edit name:", e.name);
  const newAmount = prompt("Edit amount:", e.amount);

  if (newName && newAmount) {
    expenses[i].name = newName;
    expenses[i].amount = Number(newAmount);
    save();
    render();
  }
}

function save() {
  localStorage.setItem("expenses", JSON.stringify(expenses));
}

function clearInputs() {
  nameInput.value = "";
  amountInput.value = "";
}

const nameInput = document.getElementById("name");
const amountInput = document.getElementById("amount");
const categoryInput = document.getElementById("category");

function render() {
  const list = document.getElementById("list");
  const filter = document.getElementById("filter").value;
  const totals = document.getElementById("totals");

  list.innerHTML = "";
  let total = 0;
  let categoryTotals = {};

  const filtered = expenses.filter(e =>
    filter === "all" || e.category === filter
  );

  filtered.forEach((exp, index) => {
    total += exp.amount;

    categoryTotals[exp.category] =
      (categoryTotals[exp.category] || 0) + exp.amount;

    list.innerHTML += `
      <li>
        <div style="display:flex; justify-content:space-between;">
          <div>
            <strong>${getIcon(exp.category)} ${exp.name}</strong>
            <br>
            <small>${exp.category} • ${exp.date}</small>
          </div>
          <div><strong>${exp.amount} DT</strong></div>
        </div>

        <div class="actions">
          <button onclick="editExpense(${index})">Edit</button>
          <button onclick="deleteExpense(${index})">Delete</button>
        </div>
      </li>
    `;
  });

  totals.innerText = "Total: " + total + " DT";

  updateChart(categoryTotals);
}

function updateChart(data) {
  const ctx = document.getElementById("chart");

  if (chart) chart.destroy();

  chart = new Chart(ctx, {
    type: "doughnut",
    data: {
      labels: Object.keys(data),
      datasets: [{
        data: Object.values(data),
        backgroundColor: [
          "#6366f1",
          "#8b5cf6",
          "#22c55e",
          "#f59e0b"
        ]
      }]
    },
    options: {
      plugins: {
        legend: {
          labels: { color: "white" }
        }
      }
    }
  });
}

render();
</script>

</body>
</html>
