<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expense Tracker</title>

<style>
  body {
    font-family: Arial;
    background: #f5f5f5;
    display: flex;
    justify-content: center;
    padding: 20px;
  }

  .container {
    background: white;
    padding: 20px;
    border-radius: 12px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  }

  h2 { text-align: center; }

  input, select, button {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
  }

  button {
    background: black;
    color: white;
    border: none;
    cursor: pointer;
    border-radius: 6px;
  }

  ul {
    list-style: none;
    padding: 0;
    margin-top: 10px;
  }

  li {
    background: #eee;
    padding: 10px;
    margin-top: 8px;
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .small {
    font-size: 12px;
    opacity: 0.7;
  }

  .actions button {
    margin-top: 5px;
    padding: 5px;
    font-size: 12px;
  }

  .totals {
    margin-top: 15px;
    font-size: 14px;
    background: #fafafa;
    padding: 10px;
    border-radius: 8px;
  }
</style>
</head>

<body>

<div class="container">
  <h2>Expense Tracker</h2>

  <input id="name" placeholder="Expense name">
  <input id="amount" type="number" placeholder="Amount">

  <select id="category">
    <option value="Food">Food</option>
    <option value="Transport">Transport</option>
    <option value="Study">Study</option>
    <option value="Other">Other</option>
  </select>

  <button onclick="addExpense()">Add Expense</button>

  <ul id="list"></ul>

  <div class="totals" id="totals"></div>
</div>

<script>
let expenses = JSON.parse(localStorage.getItem("expenses")) || [];

function addExpense() {
  const name = document.getElementById("name").value;
  const amount = document.getElementById("amount").value;
  const category = document.getElementById("category").value;

  if (!name || !amount) return;

  expenses.push({
    name,
    amount: Number(amount),
    category,
    date: new Date().toLocaleDateString()
  });

  save();
  clearInputs();
  render();
}

function deleteExpense(index) {
  expenses.splice(index, 1);
  save();
  render();
}

function editExpense(index) {
  const exp = expenses[index];

  const newName = prompt("Edit name:", exp.name);
  const newAmount = prompt("Edit amount:", exp.amount);

  if (newName && newAmount) {
    expenses[index].name = newName;
    expenses[index].amount = Number(newAmount);
    save();
    render();
  }
}

function save() {
  localStorage.setItem("expenses", JSON.stringify(expenses));
}

function clearInputs() {
  document.getElementById("name").value = "";
  document.getElementById("amount").value = "";
}

function render() {
  const list = document.getElementById("list");
  const totals = document.getElementById("totals");

  list.innerHTML = "";

  let total = 0;
  let categoryTotals = {};

  expenses.forEach((exp, index) => {
    total += exp.amount;

    categoryTotals[exp.category] = (categoryTotals[exp.category] || 0) + exp.amount;

    list.innerHTML += `
      <li>
        <div class="row">
          <strong>${exp.name}</strong>
          <span>${exp.amount} DT</span>
        </div>

        <div class="small">
          ${exp.category} • ${exp.date}
        </div>

        <div class="actions">
          <button onclick="editExpense(${index})">Edit</button>
          <button onclick="deleteExpense(${index})">Delete</button>
        </div>
      </li>
    `;
  });

  let categoryText = "";
  for (let cat in categoryTotals) {
    categoryText += `${cat}: ${categoryTotals[cat]} DT\n`;
  }

  totals.innerText =
    `Total: ${total} DT\n\nBy Category:\n${categoryText}`;
}

render();
</script>

</body>
</html>
