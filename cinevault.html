<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CineVault</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

body {
  margin: 0;
  font-family: Arial, sans-serif;
  color: white;
  background: #000;
  overflow-x: hidden;
}

/* BACKDROP (ALWAYS ACTIVE SYSTEM) */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background-size: cover;
  background-position: center;
  filter: blur(45px) brightness(0.25);
  transform: scale(1.2);
  z-index: -2;
  transition: 0.5s ease;
}

body::after {
  content: "";
  position: fixed;
  inset: 0;
  background: radial-gradient(circle at top, transparent 10%, rgba(0,0,0,0.92) 80%);
  z-index: -1;
}

/* HERO */
.hero {
  text-align: center;
  padding: 40px 20px;
}

.logo {
  font-size: 42px;
  color: #e50914;
  font-weight: bold;
}

.search input {
  width: 260px;
  padding: 10px;
  border-radius: 30px;
  border: none;
  outline: none;
}

/* NAV */
.nav {
  display: flex;
  gap: 15px;
  justify-content: center;
  margin-top: 10px;
}

.nav div {
  cursor: pointer;
  padding: 6px 12px;
  border-radius: 20px;
  background: rgba(255,255,255,0.05);
}

/* ROWS */
.row {
  padding: 20px;
}

.cards {
  display: flex;
  gap: 12px;
  overflow-x: auto;
}

/* CARD */
.card {
  width: 140px;
  cursor: pointer;
  transition: 0.3s;
  flex-shrink: 0;
}

.card img {
  width: 100%;
  border-radius: 10px;
}

.card:hover {
  transform: scale(1.12);
}

/* DETAILS */
#details {
  display: none;
  padding: 20px;
}

.details-box {
  max-width: 1000px;
  margin: auto;
}

.poster {
  width: 180px;
  border-radius: 12px;
  float: left;
  margin-right: 20px;
}

/* BUTTON */
.btn {
  background: #e50914;
  border: none;
  padding: 10px 14px;
  color: white;
  border-radius: 20px;
  cursor: pointer;
}

/* ACTOR */
.actor {
  display: inline-block;
  padding: 5px 10px;
  background: rgba(255,255,255,0.1);
  border-radius: 8px;
  cursor: pointer;
  margin: 3px;
}

.actor:hover {
  background: #e50914;
}

/* EPISODES */
.episodes {
  display: flex;
  overflow-x: auto;
  gap: 10px;
  margin-top: 10px;
}

.ep {
  width: 150px;
  cursor: pointer;
}

.ep img {
  width: 100%;
  border-radius: 10px;
}

/* MODAL */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.9);
  display: none;
  justify-content: center;
  align-items: center;
}

iframe {
  width: 80%;
  height: 60%;
}

</style>
</head>

<body>

<div class="hero">
  <div class="logo">CineVault</div>

  <div class="search">
    <input id="search" placeholder="Search movies, series, actors">
  </div>

  <div class="nav">
    <div onclick="loadTrending()"><i class="fa fa-fire"></i> Trending</div>
    <div onclick="loadPopular()"><i class="fa fa-star"></i> Popular</div>
    <div onclick="loadTop()"><i class="fa fa-trophy"></i> Top Rated</div>
  </div>
</div>

<div id="home">
  <div class="row">
    <h2>Trending</h2>
    <div class="cards" id="trending"></div>
  </div>

  <div class="row">
    <h2>Popular</h2>
    <div class="cards" id="popular"></div>
  </div>

  <div class="row">
    <h2>Top Rated</h2>
    <div class="cards" id="top"></div>
  </div>
</div>

<div id="details">
  <button class="btn" onclick="goBack()"><i class="fa fa-arrow-left"></i> Back</button>
  <div class="details-box" id="detailsBox"></div>
</div>

<div class="modal" id="modal" onclick="closeTrailer()">
  <iframe id="video"></iframe>
</div>

<script>

const API = "e80c4ac2851ab20db77422d53f9c846a";

let currentId = null;
let currentType = null;

/* BACKDROP */
function setBg(path){
  if(!path) return;
  document.body.style.backgroundImage =
    `url(https://image.tmdb.org/t/p/original${path})`;
}

/* LOAD LIST */
async function load(url, id){
  const res = await fetch(url);
  const data = await res.json();

  const box = document.getElementById(id);
  box.innerHTML = "";

  data.results.forEach(m=>{
    if(!m.poster_path) return;

    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `<img src="https://image.tmdb.org/t/p/w500${m.poster_path}">`;

    div.onclick = ()=> openDetails(m.id, m.media_type || "movie");
    box.appendChild(div);
  });
}

/* NAV LOADERS */
function loadTrending(){
  load(`https://api.themoviedb.org/3/trending/all/day?api_key=${API}`,"trending");
}

function loadPopular(){
  load(`https://api.themoviedb.org/3/movie/popular?api_key=${API}`,"popular");
}

function loadTop(){
  load(`https://api.themoviedb.org/3/movie/top_rated?api_key=${API}`,"top");
}

/* SEARCH */
document.getElementById("search").addEventListener("input", async e=>{
  const q = e.target.value;
  if(q.length < 2) return loadTrending();

  const res = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${API}&query=${q}`);
  const data = await res.json();

  const box = document.getElementById("trending");
  box.innerHTML = "";

  data.results.forEach(m=>{
    if(!m.poster_path) return;

    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `<img src="https://image.tmdb.org/t/p/w500${m.poster_path}">`;

    div.onclick = ()=> openDetails(m.id, m.media_type);
    box.appendChild(div);
  });
});

/* DETAILS */
async function openDetails(id,type){

  currentId = id;
  currentType = type;

  const res = await fetch(
    `https://api.themoviedb.org/3/${type}/${id}?api_key=${API}&append_to_response=videos,credits`
  );

  const data = await res.json();

  setBg(data.backdrop_path);

  document.getElementById("home").style.display="none";
  document.getElementById("details").style.display="block";

  const trailer = data.videos.results.find(v=>v.type==="Trailer");

  const actors = data.credits.cast.slice(0,6);

  let seasonsHTML = "";

  if(type === "tv"){
    seasonsHTML = `
      <h3>Seasons</h3>
      ${data.seasons.map(s=>
        `<div class="actor" onclick="loadSeason(${s.season_number})">${s.name}</div>`
      ).join("")}

      <div class="episodes" id="episodes"></div>
      <div id="epDetails"></div>
    `;
  }

  document.getElementById("detailsBox").innerHTML = `
    <img class="poster" src="https://image.tmdb.org/t/p/w500${data.poster_path}">

    <h1>${data.title || data.name}</h1>

    <p>⭐ ${data.vote_average} | ${data.runtime || "Series"}</p>

    <p>${data.overview}</p>

    <h3>Actors</h3>
    ${actors.map(a=>`
      <span class="actor" onclick="openActor(${a.id})">${a.name}</span>
    `).join("")}

    ${seasonsHTML}

    ${trailer ? `<button class="btn" onclick="playTrailer('${trailer.key}')">Trailer</button>` : ""}
  `;
}

/* SEASONS */
async function loadSeason(num){
  const res = await fetch(`https://api.themoviedb.org/3/tv/${currentId}/season/${num}?api_key=${API}`);
  const data = await res.json();

  const box = document.getElementById("episodes");
  box.innerHTML = "";

  data.episodes.forEach(ep=>{
    const div = document.createElement("div");
    div.className="ep";

    div.innerHTML = `
      <img src="https://image.tmdb.org/t/p/w300${ep.still_path}">
      <small>${ep.episode_number}. ${ep.name}</small>
    `;

    div.onclick = ()=>{
      document.getElementById("epDetails").innerHTML = `
        <h3>${ep.name}</h3>
        <p>${ep.overview}</p>
        <p>⭐ ${ep.vote_average}</p>
      `;
    };

    box.appendChild(div);
  });
}

/* ACTOR PAGE (REAL PROFILE) */
async function openActor(id){

  const res = await fetch(
    `https://api.themoviedb.org/3/person/${id}?api_key=${API}&append_to_response=combined_credits`
  );

  const data = await res.json();

  document.getElementById("home").style.display="none";
  document.getElementById("details").style.display="block";

  setBg(data.profile_path);

  const movies = data.combined_credits.cast.sort((a,b)=>b.popularity-a.popularity);

  document.getElementById("detailsBox").innerHTML = `
    <div style="display:flex; gap:20px; flex-wrap:wrap;">

      <img src="https://image.tmdb.org/t/p/w300${data.profile_path}"
      style="width:180px;border-radius:12px;">

      <div>
        <h1>${data.name}</h1>
        <p><b>Birthday:</b> ${data.birthday || "Unknown"}</p>
        <p>${(data.biography || "").slice(0,400)}...</p>
      </div>
    </div>

    <h2>Filmography</h2>

    <div style="display:flex; overflow-x:auto; gap:10px;">
      ${movies.slice(0,20).map(m=>`
        <div class="card" onclick="openDetails(${m.id},'${m.media_type}')">
          <img src="https://image.tmdb.org/t/p/w300${m.poster_path}">
        </div>
      `).join("")}
    </div>
  `;
}

/* TRAILER */
function playTrailer(key){
  document.getElementById("modal").style.display="flex";
  document.getElementById("video").src=`https://www.youtube.com/embed/${key}`;
}

function closeTrailer(){
  document.getElementById("modal").style.display="none";
  document.getElementById("video").src="";
}

/* BACK BUTTON (FIXED) */
function goBack(){
  document.getElementById("home").style.display="block";
  document.getElementById("details").style.display="none";
  loadTrending();
}

/* INIT */
loadTrending();
loadPopular();
loadTop();

</script>

</body>
</html>
